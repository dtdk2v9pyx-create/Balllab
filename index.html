<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BallLab — Interactive Physics</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --bg: #080b12;
    --panel: rgba(18, 23, 34, .92);
    --panel2: #111724;
    --border: rgba(255,255,255,.09);
    --text: #f4f7fb;
    --muted: #8d98aa;
    --accent: #6d7cff;
    --accent2: #9b6dff;
    --danger: #ff5964;
}

body {
    font-family: Inter, Arial, sans-serif;
    background:
        radial-gradient(circle at 20% 10%, rgba(109,124,255,.13), transparent 30%),
        radial-gradient(circle at 80% 90%, rgba(155,109,255,.1), transparent 30%),
        var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow: hidden;
}

/* TOP BAR */

.topbar {
    height: 68px;
    border-bottom: 1px solid var(--border);
    background: rgba(8,11,18,.82);
    backdrop-filter: blur(18px);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 22px;
    position: relative;
    z-index: 10;
}

.logo {
    display: flex;
    align-items: center;
    gap: 12px;
}

.logo-icon {
    width: 38px;
    height: 38px;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: grid;
    place-items: center;
    font-size: 21px;
    box-shadow: 0 0 25px rgba(109,124,255,.35);
}

.logo h1 {
    font-size: 19px;
    letter-spacing: -.4px;
}

.logo span {
    color: var(--muted);
    font-size: 12px;
    display: block;
    margin-top: 2px;
}

.top-actions {
    display: flex;
    gap: 8px;
}

button {
    border: 0;
    color: var(--text);
    cursor: pointer;
    font: inherit;
}

.top-btn {
    background: rgba(255,255,255,.06);
    border: 1px solid var(--border);
    padding: 9px 13px;
    border-radius: 10px;
    transition: .2s;
}

.top-btn:hover {
    background: rgba(255,255,255,.11);
}

/* LAYOUT */

.app {
    height: calc(100vh - 68px);
    display: grid;
    grid-template-columns: 300px 1fr;
}

/* SIDEBAR */

.sidebar {
    border-right: 1px solid var(--border);
    background: rgba(10,14,22,.78);
    padding: 18px;
    overflow-y: auto;
}

.section {
    margin-bottom: 22px;
}

.section-title {
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1.2px;
    margin-bottom: 11px;
}

.mode-grid {
    display: grid;
    gap: 7px;
}

.mode {
    background: rgba(255,255,255,.045);
    border: 1px solid transparent;
    border-radius: 11px;
    padding: 12px;
    text-align: left;
    transition: .2s;
}

.mode:hover {
    background: rgba(255,255,255,.075);
}

.mode.active {
    background: rgba(109,124,255,.14);
    border-color: rgba(109,124,255,.4);
}

.mode strong {
    display: block;
    font-size: 13px;
}

.mode small {
    display: block;
    color: var(--muted);
    margin-top: 4px;
    font-size: 11px;
}

/* CONTROLS */

.control {
    margin-bottom: 15px;
}

.control-head {
    display: flex;
    justify-content: space-between;
    margin-bottom: 7px;
    font-size: 12px;
}

.value {
    color: #aeb8ff;
}

input[type="range"] {
    width: 100%;
    accent-color: var(--accent);
}

.color-row {
    display: flex;
    align-items: center;
    gap: 10px;
}

input[type="color"] {
    width: 42px;
    height: 30px;
    border: none;
    background: transparent;
    padding: 0;
}

/* SWITCH */

.switch-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 13px 0;
    font-size: 12px;
}

.switch {
    width: 38px;
    height: 21px;
    border-radius: 20px;
    background: #29303e;
    padding: 3px;
    transition: .2s;
}

.switch::after {
    content: "";
    display: block;
    width: 15px;
    height: 15px;
    border-radius: 50%;
    background: white;
    transition: .2s;
}

.switch.on {
    background: var(--accent);
}

.switch.on::after {
    transform: translateX(17px);
}

/* MAIN */

.main {
    position: relative;
    overflow: hidden;
}

#canvas {
    width: 100%;
    height: 100%;
    display: block;
    cursor: crosshair;
}

/* HUD */

.hud {
    position: absolute;
    top: 18px;
    left: 18px;
    display: flex;
    gap: 8px;
    pointer-events: none;
}

.stat {
    min-width: 82px;
    padding: 9px 11px;
    border-radius: 11px;
    background: rgba(12,16,25,.72);
    border: 1px solid var(--border);
    backdrop-filter: blur(12px);
}

.stat small {
    color: var(--muted);
    display: block;
    font-size: 10px;
}

.stat b {
    font-size: 15px;
}

/* CENTER MESSAGE */

.center-message {
    position: absolute;
    inset: 0;
    pointer-events: none;
    display: grid;
    place-items: center;
}

.center-content {
    text-align: center;
    opacity: .45;
    transition: .3s;
}

.center-content.hidden {
    opacity: 0;
}

.center-content .big {
    font-size: 48px;
    margin-bottom: 8px;
}

.center-content p {
    color: var(--muted);
    font-size: 13px;
}

/* BOTTOM */

.bottom {
    position: absolute;
    bottom: 18px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 8px;
    background: rgba(12,16,25,.78);
    border: 1px solid var(--border);
    padding: 7px;
    border-radius: 14px;
    backdrop-filter: blur(15px);
}

.action {
    padding: 9px 15px;
    border-radius: 9px;
    background: transparent;
    font-size: 12px;
}

.action:hover {
    background: rgba(255,255,255,.08);
}

.action.primary {
    background: var(--accent);
    box-shadow: 0 5px 20px rgba(109,124,255,.25);
}

.action.danger {
    color: #ff8990;
}

/* RESPONSIVE */

@media (max-width: 800px) {
    body {
        overflow: auto;
    }

    .app {
        height: auto;
        min-height: calc(100vh - 68px);
        display: block;
    }

    .sidebar {
        position: absolute;
        z-index: 8;
        width: 280px;
        height: calc(100vh - 68px);
        transform: translateX(-100%);
        transition: .3s;
    }

    .sidebar.open {
        transform: translateX(0);
    }

    .main {
        height: calc(100vh - 68px);
    }

    .hud {
        top: 10px;
        left: 10px;
    }

    .stat {
        min-width: 65px;
        padding: 7px;
    }

    .bottom {
        bottom: 10px;
        width: calc(100% - 20px);
        justify-content: center;
    }

    .action {
        padding: 9px 10px;
    }
}
</style>
</head>

<body>

<header class="topbar">

    <div class="logo">
        <div class="logo-icon">●</div>
        <div>
            <h1>BallLab</h1>
            <span>Interactive Physics Playground</span>
        </div>
    </div>

    <div class="top-actions">
        <button class="top-btn" id="menuBtn">☰</button>
        <button class="top-btn" id="fullscreenBtn">⛶</button>
    </div>

</header>

<div class="app">

    <aside class="sidebar" id="sidebar">

        <div class="section">
            <div class="section-title">Режим</div>

            <div class="mode-grid">

                <button class="mode active" data-mode="gravity">
                    <strong>Гравитация</strong>
                    <small>Шарики падают вниз</small>
                </button>

                <button class="mode" data-mode="zero">
                    <strong>Невесомость</strong>
                    <small>Свободное движение</small>
                </button>

                <button class="mode" data-mode="bounce">
                    <strong>Упругий хаос</strong>
                    <small>Сильные столкновения</small>
                </button>

                <button class="mode" data-mode="magnet">
                    <strong>Магнит</strong>
                    <small>Курсор притягивает шары</small>
                </button>

            </div>
        </div>

        <div class="section">

            <div class="section-title">Физика</div>

            <div class="control">
                <div class="control-head">
                    <span>Гравитация</span>
                    <span class="value" id="gravityValue">0.35</span>
                </div>
                <input id="gravity" type="range" min="-0.5" max="1.5" step="0.01" value="0.35">
            </div>

            <div class="control">
                <div class="control-head">
                    <span>Упругость</span>
                    <span class="value" id="bounceValue">0.85</span>
                </div>
                <input id="bounce" type="range" min="0" max="1.2" step="0.01" value="0.85">
            </div>

            <div class="control">
                <div class="control-head">
                    <span>Трение</span>
                    <span class="value" id="frictionValue">0.995</span>
                </div>
                <input id="friction" type="range" min="0.9" max="1" step="0.001" value="0.995">
            </div>

            <div class="control">
                <div class="control-head">
                    <span>Размер</span>
                    <span class="value" id="sizeValue">14</span>
                </div>
                <input id="size" type="range" min="5" max="35" value="14">
            </div>

            <div class="control">
                <div class="control-head">
                    <span>Количество</span>
                    <span class="value" id="countValue">35</span>
                </div>
                <input id="count" type="range" min="5" max="120" value="35">
            </div>

        </div>

        <div class="section">

            <div class="section-title">Внешний вид</div>

            <div class="color-row">
                <span style="font-size:12px;">Цвет шариков</span>
                <input id="color" type="color" value="#6d7cff">
            </div>

            <div class="switch-row">
                <span>Хвосты</span>
                <button class="switch on" id="trails"></button>
            </div>

            <div class="switch-row">
                <span>Свечение</span>
                <button class="switch on" id="glow"></button>
            </div>

            <div class="switch-row">
                <span>Столкновения</span>
                <button class="switch on" id="collisions"></button>
            </div>

        </div>

    </aside>

    <main class="main">

        <canvas id="canvas"></canvas>

        <div class="hud">

            <div class="stat">
                <small>Шары</small>
                <b id="ballCounter">35</b>
            </div>

            <div class="stat">
                <small>FPS</small>
                <b id="fps">60</b>
            </div>

            <div class="stat">
                <small>Энергия</small>
                <b id="energy">0</b>
            </div>

        </div>

        <div class="center-message" id="message">
            <div class="center-content">
                <div class="big">●</div>
                <p>Кликни по экрану, чтобы добавить шарик</p>
            </div>
        </div>

        <div class="bottom">

            <button class="action primary" id="addBtn">
                ＋ Добавить
            </button>

            <button class="action" id="pauseBtn">
                ❚❚ Пауза
            </button>

            <button class="action" id="randomBtn">
                ⤨ Хаос
            </button>

            <button class="action danger" id="clearBtn">
                Очистить
            </button>

        </div>

    </main>

</div>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let W = 0;
let H = 0;

const balls = [];

const settings = {
    gravity: 0.35,
    bounce: 0.85,
    friction: 0.995,
    size: 14,
    count: 35,
    color: "#6d7cff",
    trails: true,
    glow: true,
    collisions: true,
    mode: "gravity"
};

let paused = false;
let mouse = {
    x: 0,
    y: 0,
    active: false
};

let lastTime = performance.now();
let fps = 60;

/* RESIZE */

function resize() {

    const rect = canvas.getBoundingClientRect();

    W = canvas.width = rect.width * devicePixelRatio;
    H = canvas.height = rect.height * devicePixelRatio;

    ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);

    W = rect.width;
    H = rect.height;
}

window.addEventListener("resize", resize);
resize();

/* BALL */

class Ball {

    constructor(x, y) {

        this.x = x;
        this.y = y;

        const angle = Math.random() * Math.PI * 2;
        const speed = 1 + Math.random() * 4;

        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;

        this.r = settings.size * (.7 + Math.random() * .5);

        this.mass = this.r * this.r;

        this.hue = Math.random() * 360;

        this.history = [];
    }

    update() {

        if (settings.mode === "gravity") {
            this.vy += settings.gravity;
        }

        if (settings.mode === "zero") {
            this.vx *= .999;
            this.vy *= .999;
        }

        if (settings.mode === "bounce") {
            this.vy += settings.gravity * .55;
        }

        if (settings.mode === "magnet" && mouse.active) {

            const dx = mouse.x - this.x;
            const dy = mouse.y - this.y;

            const dist = Math.sqrt(dx * dx + dy * dy);

            if (dist < 400 && dist > 10) {

                const force = 1.5 / dist;

                this.vx += dx * force;
                this.vy += dy * force;
            }
        }

        this.vx *= settings.friction;
        this.vy *= settings.friction;

        this.x += this.vx;
        this.y += this.vy;

        /* WALLS */

        if (this.x + this.r > W) {

            this.x = W - this.r;
            this.vx *= -settings.bounce;
        }

        if (this.x - this.r < 0) {

            this.x = this.r;
            this.vx *= -settings.bounce;
        }

        if (this.y + this.r > H) {

            this.y = H - this.r;
            this.vy *= -settings.bounce;
        }

        if (this.y - this.r < 0) {

            this.y = this.r;
            this.vy *= -settings.bounce;
        }

        if (settings.trails) {

            this.history.push({
                x: this.x,
                y: this.y
            });

            if (this.history.length > 8) {
                this.history.shift();
            }
        }
    }

    draw() {

        if (settings.trails && this.history.length > 1) {

            ctx.beginPath();

            ctx.moveTo(
                this.history[0].x,
                this.history[0].y
            );

            for (let p of this.history) {
                ctx.lineTo(p.x, p.y);
            }

            ctx.strokeStyle = hexToRgba(settings.color, .16);
            ctx.lineWidth = this.r * .7;
            ctx.lineCap = "round";
            ctx.stroke();
        }

        if (settings.glow) {

            ctx.shadowBlur = 22;
            ctx.shadowColor = settings.color;
        }

        const gradient = ctx.createRadialGradient(
            this.x - this.r * .35,
            this.y - this.r * .35,
            1,
            this.x,
            this.y,
            this.r
        );

        gradient.addColorStop(0, "#ffffff");
        gradient.addColorStop(.15, settings.color);
        gradient.addColorStop(1, darken(settings.color));

        ctx.fillStyle = gradient;

        ctx.beginPath();
        ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
        ctx.fill();

        ctx.shadowBlur = 0;
    }
}

/* HELPERS */

function hexToRgba(hex, alpha) {

    const bigint = parseInt(hex.slice(1), 16);

    const r = (bigint >> 16) & 255;
    const g = (bigint >> 8) & 255;
    const b = bigint & 255;

    return `rgba(${r},${g},${b},${alpha})`;
}

function darken(hex) {

    const bigint = parseInt(hex.slice(1), 16);

    let r = ((bigint >> 16) & 255) * .35;
    let g = ((bigint >> 8) & 255) * .35;
    let b = (bigint & 255) * .35;

    return `rgb(${r},${g},${b})`;
}

/* COLLISIONS */

function collide(a, b) {

    if (!settings.collisions) return;

    const dx = b.x - a.x;
    const dy = b.y - a.y;

    const dist = Math.sqrt(dx * dx + dy * dy);

    const minDist = a.r + b.r;

    if (dist < minDist && dist > 0) {

        const nx = dx / dist;
        const ny = dy / dist;

        const overlap = minDist - dist;

        a.x -= nx * overlap * .5;
        a.y -= ny * overlap * .5;

        b.x += nx * overlap * .5;
        b.y += ny * overlap * .5;

        const relativeVelocity =
            (b.vx - a.vx) * nx +
            (b.vy - a.vy) * ny;

        if (relativeVelocity > 0) return;

        const impulse =
            -(1 + settings.bounce) *
            relativeVelocity /
            (1 / a.mass + 1 / b.mass);

        const ix = impulse * nx;
        const iy = impulse * ny;

        a.vx -= ix / a.mass;
        a.vy -= iy / a.mass;

        b.vx += ix / b.mass;
        b.vy += iy / b.mass;
    }
}

/* ADD BALL */

function addBall(x = Math.random() * W, y = Math.random() * H * .5) {

    balls.push(new Ball(x, y));

    updateCounter();
}

/* INITIAL */

for (let i = 0; i < settings.count; i++) {
    addBall();
}

/* LOOP */

function animate(now) {

    requestAnimationFrame(animate);

    const delta = Math.min((now - lastTime) / 16.67, 2);
    lastTime = now;

    fps = fps * .9 + (1000 / Math.max(now - (now - 16.67), 1)) * .1;

    if (!paused) {

        for (const ball of balls) {
            ball.update();
        }

        for (let i = 0; i < balls.length; i++) {

            for (let j = i + 1; j < balls.length; j++) {

                collide(balls[i], balls[j]);
            }
        }
    }

    if (settings.trails) {

        ctx.fillStyle = "rgba(8,11,18,.20)";
        ctx.fillRect(0, 0, W, H);

    } else {

        ctx.clearRect(0, 0, W, H);

        ctx.fillStyle = "#080b12";
        ctx.fillRect(0, 0, W, H);
    }

    /* GRID */

    ctx.save();

    ctx.globalAlpha = .035;
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 1;

    const grid = 50;

    for (let x = 0; x < W; x += grid) {

        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, H);
        ctx.stroke();
    }

    for (let y = 0; y < H; y += grid) {

        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(W, y);
        ctx.stroke();
    }

    ctx.restore();

    for (const ball of balls) {
        ball.draw();
    }

    updateHUD();

}

requestAnimationFrame(animate);

/* HUD */

function updateHUD() {

    document.getElementById("ballCounter").textContent =
        balls.length;

    document.getElementById("fps").textContent =
        Math.round(fps);

    let energy = 0;

    for (const ball of balls) {

        energy +=
            .5 * ball.mass *
            (ball.vx * ball.vx + ball.vy * ball.vy);
    }

    document.getElementById("energy").textContent =
        Math.round(energy);
}

function updateCounter() {

    document.getElementById("ballCounter").textContent =
        balls.length;
}

/* MOUSE */

canvas.addEventListener("pointermove", e => {

    const rect = canvas.getBoundingClientRect();

    mouse.x = e.clientX - rect.left;
    mouse.y = e.clientY - rect.top;

    mouse.active = true;
});

canvas.addEventListener("pointerleave", () => {
    mouse.active = false;
});

canvas.addEventListener("pointerdown", e => {

    if (e.button !== 0) return;

    const rect = canvas.getBoundingClientRect();

    addBall(
        e.clientX - rect.left,
        e.clientY - rect.top
    );
});

/* SLIDERS */

function slider(id, valueId, key) {

    const input = document.getElementById(id);
    const output = document.getElementById(valueId);

    input.addEventListener("input", () => {

        settings[key] = Number(input.value);

        output.textContent = input.value;

        if (key === "count") {

            while (balls.length < settings.count) {
                addBall();
            }

            while (balls.length > settings.count) {
                balls.pop();
            }
        }

        if (key === "size") {

            for (const ball of balls) {
                ball.r = settings.size *
                    (.7 + Math.random() * .5);
            }
        }
    });
}

slider("gravity", "gravityValue", "gravity");
slider("bounce", "bounceValue", "bounce");
slider("friction", "frictionValue", "friction");
slider("size", "sizeValue", "size");
slider("count", "countValue", "count");

/* COLOR */

document.getElementById("color").addEventListener("input", e => {

    settings.color = e.target.value;
});

/* SWITCHES */

function switchButton(id, key) {

    const button = document.getElementById(id);

    button.addEventListener("click", () => {

        settings[key] = !settings[key];

        button.classList.toggle(
            "on",
            settings[key]
        );
    });
}

switchButton("trails", "trails");
switchButton("glow", "glow");
switchButton("collisions", "collisions");

/* MODES */

document.querySelectorAll(".mode").forEach(button => {

    button.addEventListener("click", () => {

        document.querySelectorAll(".mode")
            .forEach(b => b.classList.remove("active"));

        button.classList.add("active");

        settings.mode = button.dataset.mode;

        if (settings.mode === "zero") {
            settings.gravity = 0;
            document.getElementById("gravity").value = 0;
            document.getElementById("gravityValue").textContent = "0";
        }

        if (settings.mode === "bounce") {
            settings.gravity = .35;
            settings.bounce = 1.05;

            document.getElementById("gravity").value = .35;
            document.getElementById("bounce").value = 1.05;

            document.getElementById("gravityValue").textContent = ".35";
            document.getElementById("bounceValue").textContent = "1.05";
        }

        if (settings.mode === "gravity") {
            settings.gravity = .35;

            document.getElementById("gravity").value = .35;
            document.getElementById("gravityValue").textContent = ".35";
        }
    });
});

/* BUTTONS */

document.getElementById("addBtn").addEventListener("click", () => {

    for (let i = 0; i < 5; i++) {
        addBall();
    }

    settings.count = balls.length;

    document.getElementById("count").value = balls.length;
    document.getElementById("countValue").textContent = balls.length;
});

document.getElementById("clearBtn").addEventListener("click", () => {

    balls.length = 0;
    updateCounter();
});

document.getElementById("randomBtn").addEventListener("click", () => {

    for (const ball of balls) {

        const angle = Math.random() * Math.PI * 2;
        const speed = 4 + Math.random() * 10;

        ball.vx = Math.cos(angle) * speed;
        ball.vy = Math.sin(angle) * speed;
    }
});

document.getElementById("pauseBtn").addEventListener("click", e => {

    paused = !paused;

    e.target.textContent =
        paused ? "▶ Продолжить" : "❚❚ Пауза";
});

/* MENU */

document.getElementById("menuBtn").addEventListener("click", () => {

    document.getElementById("sidebar")
        .classList.toggle("open");
});

/* FULLSCREEN */

document.getElementById("fullscreenBtn").addEventListener("click", () => {

    if (!document.fullscreenElement) {

        document.documentElement.requestFullscreen();

    } else {

        document.exitFullscreen();
    }
});

/* KEYBOARD */

window.addEventListener("keydown", e => {

    if (e.code === "Space") {

        e.preventDefault();

        paused = !paused;

        document.getElementById("pauseBtn").textContent =
            paused ? "▶ Продолжить" : "❚❚ Пауза";
    }

    if (e.key.toLowerCase() === "r") {

        for (const ball of balls) {

            ball.x = Math.random() * W;
            ball.y = Math.random() * H;

            ball.vx = (Math.random() - .5) * 10;
            ball.vy = (Math.random() - .5) * 10;
        }
    }

    if (e.key.toLowerCase() === "c") {

        balls.length = 0;
        updateCounter();
    }
});

</script>

</body>
</html>
